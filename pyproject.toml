[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satbba"
version = "0.2.0"
description = "Production-oriented satellite bundle block adjustment scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SatBBA Team"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "opencv-python>=4.8",
  "rpcm>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
  "ruff>=0.4",
]

[project.scripts]
satbba = "satbba.cli.main:main"
sat_bba = "satbba.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
